apiVersion: v1
kind: Service
metadata:
  name: pathfinder
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/part-of: pathfinder-dev
spec:
  selector:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/part-of: pathfinder-dev
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathfinder
  labels:
    app.kubernetes.io/name: pathfinder
    app.kubernetes.io/part-of: pathfinder-dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pathfinder
      app.kubernetes.io/part-of: pathfinder-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pathfinder
        app.kubernetes.io/part-of: pathfinder-dev
    spec:
      initContainers:
        - name: stage-application
          image: pathfinder-dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cp -a /app/. /work/
              mkdir -p /work/conf /work/logs /work/tmp/cache /work/export/sql
              uid="$(id -u app)"
              gid="$(id -g app)"
              chown -R "${uid}:${gid}" /work/logs /work/tmp /work/export
          volumeMounts:
            - name: application
              mountPath: /work
      containers:
        - name: php-fpm
          image: pathfinder-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
          readinessProbe:
            exec:
              command:
                - php
                - -r
                - '$s=@fsockopen("127.0.0.1",9000,$e,$m,1); if(!$s){exit(1);} fclose($s);'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - php
                - -r
                - '$s=@fsockopen("127.0.0.1",9000,$e,$m,1); if(!$s){exit(1);} fclose($s);'
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: application
              mountPath: /app
            - name: runtime-config
              mountPath: /app/conf/environment.ini
              subPath: environment.ini
              readOnly: true
            - name: pathfinder-config
              mountPath: /app/conf/pathfinder.ini
              subPath: pathfinder.ini
              readOnly: true
        - name: websocket
          image: pathfinder-websocket-dev
          imagePullPolicy: IfNotPresent
          args:
            - php
            - cmd.php
            - --wsHost=0.0.0.0
            - --wsPort=8020
            - --tcpHost=127.0.0.1
            - --tcpPort=5555
            - --debug=2
          # per-instance command-channel secret (same value as the PHP side's
          # WS_COMMAND_SECRET in environment.ini); optional so existing
          # installs keep starting (unsigned commands, warning logged).
          env:
            - name: WS_COMMAND_SECRET
              valueFrom:
                secretKeyRef:
                  name: pathfinder-runtime
                  key: ws-command-secret
                  optional: true
          ports:
            - name: websocket
              containerPort: 8020
            - name: command
              containerPort: 5555
          startupProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - php
                - -r
                - '$a=@fsockopen("127.0.0.1",8020,$e1,$m1,1); $b=@fsockopen("127.0.0.1",5555,$e2,$m2,1); if(!$a || !$b){exit(1);} fclose($a); fclose($b);'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: application
              mountPath: /app
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: application
          emptyDir: {}
        - name: runtime-config
          secret:
            secretName: pathfinder-runtime
            items:
              - key: environment.ini
                path: environment.ini
        - name: pathfinder-config
          configMap:
            name: pathfinder-config
        - name: nginx-config
          configMap:
            name: pathfinder-nginx
